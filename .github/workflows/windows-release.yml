name: Windows release evidence

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'

      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -e 'apps/api[dev]' pyinstaller

      - name: Build Windows sidecar
        shell: pwsh
        run: ./apps/desktop/scripts/build-sidecar.ps1 -Python python

      - name: Check Rust formatting and tests
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run build --workspace @agent-audit/desktop -- --bundles nsis
          $bundle = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $bundle) { throw 'Tauri did not produce an NSIS setup executable' }
          $output = Join-Path $env:RUNNER_TEMP 'agent-audit-windows-release'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $installer = Join-Path $output 'AgentAudit-0.1.3-windows-x64-setup.exe'
          Copy-Item -LiteralPath $bundle.FullName -Destination $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = [ordered]@{ version = '0.1.3'; commit = '${{ github.sha }}'; runner = 'windows-2022'; installer = (Split-Path $installer -Leaf); sha256 = $hash }
          [IO.File]::WriteAllText((Join-Path $output 'build-info.json'), ($metadata | ConvertTo-Json -Depth 3), [Text.UTF8Encoding]::new($false))

      - name: Install and launch the packaged application
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'agent-audit-windows-release'
          $installer = Join-Path $output 'AgentAudit-0.1.3-windows-x64-setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'agent-audit-installed'
          $evidence = Join-Path $env:RUNNER_TEMP 'agent-audit-windows-lifecycle'
          $home = Join-Path $env:RUNNER_TEMP 'agent-audit-isolated-home'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)" }
          $desktop = Get-ChildItem -LiteralPath $installRoot -Filter '*.exe' -File -Recurse | Where-Object { $_.Name -ne 'uninstall.exe' } | Select-Object -First 1
          if (-not $desktop) { throw 'Installed Desktop executable was not found' }
          python apps/desktop/scripts/desktop_lifecycle_runner.py `
            --artifact $desktop.FullName `
            --artifact-kind desktop `
            --iterations 2 `
            --crash-recovery `
            --output-dir $evidence `
            --agent-audit-home $home `
            --ready-timeout-seconds 60 `
            --exit-timeout-seconds 20
          if ($LASTEXITCODE -ne 0) { throw "Installed Desktop lifecycle verification failed with $LASTEXITCODE" }
          $uninstaller = Join-Path $installRoot 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'NSIS uninstaller was not installed' }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS uninstaller exited with $($process.ExitCode)" }
          if (Test-Path -LiteralPath $desktop.FullName) { throw 'Desktop executable remains after uninstall' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-audit-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent-audit-windows-release
            ${{ runner.temp }}/agent-audit-windows-lifecycle
          if-no-files-found: warn
