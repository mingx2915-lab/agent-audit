name: Linux release evidence

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf xvfb xauth dbus-x11 gnome-keyring binutils \
            webkit2gtk-driver xdotool openbox x11-utils
      - run: npm ci
      - run: python -m pip install -e 'apps/api[dev]' pyinstaller
      - name: Install pinned official Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Build and verify real Linux artifacts
        run: |
          command -v dbus-run-session
          command -v gnome-keyring-daemon
          command -v xauth
          # linuxdeploy-plugin-appimage supports LDAI_RUNTIME_FILE for offline,
          # reproducible appimagetool runtime selection. Keep the asset on an
          # immutable official type2-runtime release and verify it before the
          # Tauri build; do not let appimagetool fetch the mutable continuous
          # runtime during packaging.
          appimage_runtime="$RUNNER_TEMP/appimage-runtime-x86_64"
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 30 --max-time 120 \
            --output "$appimage_runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $appimage_runtime" \
            | sha256sum --check --status
          chmod 755 "$appimage_runtime"
          test -s "$appimage_runtime"
          export LDAI_RUNTIME_FILE="$appimage_runtime"
          export PYTHON_BIN=python
          bash apps/desktop/scripts/build-sidecar.sh
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --example secret_service_probe --release
          dbus-run-session -- sh -c '
            set -eu
            original_home="$HOME"
            export CARGO_HOME="${CARGO_HOME:-$original_home/.cargo}"
            export RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}"
            export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$original_home/.cache}"
            export PATH="$CARGO_HOME/bin:$PATH"
            root="$(mktemp -d)"
            trap "rm -rf -- \"$root\"" EXIT
            export HOME="$root/home"
            export XDG_RUNTIME_DIR="$root/run"
            control="$root/control"
            mkdir -p "$HOME/.local/share/keyrings" "$XDG_RUNTIME_DIR" "$control"
            chmod 700 "$XDG_RUNTIME_DIR" "$control"
            password="$(od -An -N24 -tx1 /dev/urandom | tr -d " \n")"
            printf "%s\n" "$password" | gnome-keyring-daemon \
              --login --components=secrets --control-directory="$control" >/dev/null
            eval "$(gnome-keyring-daemon --start --components=secrets --control-directory="$control")"
            export GNOME_KEYRING_CONTROL="$control"
            bash apps/desktop/scripts/build-linux-release.sh \
              "$RUNNER_TEMP/agent-audit-linux-release" \
              "$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/release/examples/secret_service_probe"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-audit-linux-${{ github.sha }}
          path: ${{ runner.temp }}/agent-audit-linux-release
          if-no-files-found: error
